<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ParkEase — Hanoi Smart Parking</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
  :root{
    --pink:#ff2e73; --pink-soft:#fff0f5; --pink-glow:rgba(255,46,115,.28);
    --ink:#12121c; --muted:#7a7f93; --line:#e9e9f0; --bg:#f7f7fb;
    --green:#1faa5f; --amber:#f0a020; --red:#e2413b;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--ink)}

  .app{display:grid;grid-template-columns:1fr 400px;height:100vh;height:100dvh}
  @media(max-width:900px){
    .app{grid-template-columns:1fr;grid-template-rows:42% 58%}
    .sidebar{border-left:none;border-top:1px solid var(--line);border-radius:20px 20px 0 0;
      padding:16px;box-shadow:0 -8px 28px rgba(18,18,28,.12);z-index:600}
    .brand{margin-bottom:14px}
    .searchbar{top:12px;left:12px;right:12px}
    .search{padding:10px 13px;max-width:none}
    .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-top:8px;padding-bottom:2px}
    .chips::-webkit-scrollbar{display:none}
    .chip{flex:0 0 auto;padding:6px 11px;font-size:.72rem}
  }

  #map{height:100%;width:100%;z-index:1}
  .map-wrap{position:relative;overflow:hidden}

  .searchbar{position:absolute;top:18px;left:18px;right:18px;z-index:500;display:flex;gap:10px;align-items:center}
  .search{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;
    display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(18,18,28,.08);max-width:460px}
  .search i{color:var(--pink)}
  .search input{border:none;outline:none;flex:1;font-size:.92rem;font-weight:600;background:transparent}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .chip{background:#fff;border:1px solid var(--line);border-radius:30px;padding:8px 14px;
    font-size:.76rem;font-weight:700;color:#4a5066;cursor:pointer;display:flex;align-items:center;
    gap:6px;transition:.15s;box-shadow:0 2px 8px rgba(18,18,28,.04)}
  .chip i{font-size:.72rem;color:#8b90a3}
  .chip.active{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip.active i{color:var(--pink)}

  .pin{display:inline-flex;align-items:center;gap:6px;width:max-content;background:#fff;
    border-radius:30px;padding:6px 11px;font-weight:800;font-size:.73rem;color:var(--ink);
    white-space:nowrap;box-shadow:0 4px 16px rgba(18,18,28,.22);
    border:1.5px solid rgba(18,18,28,.08);transform:translate(-50%,-50%);transition:transform .15s,background .15s,color .15s}
  .leaflet-marker-icon:hover{z-index:1000!important}
  .leaflet-marker-icon:hover .pin{transform:translate(-50%,-50%) scale(1.06)}
  .pin .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .pin .ev-ico{color:var(--pink);font-size:.66rem}
  .pin.green .dot{background:var(--green)}
  .pin.amber .dot{background:var(--amber)}
  .pin.red .dot{background:var(--red)}
  .pin.selected{background:var(--pink);color:#fff;border-color:#fff;
    box-shadow:0 8px 24px var(--pink-glow);transform:translate(-50%,-50%) scale(1.08)}
  .pin.selected .dot{background:#fff}
  .pin.selected .ev-ico{color:#fff}
  .leaflet-marker-icon:hover .pin.selected{transform:translate(-50%,-50%) scale(1.11)}

  .sidebar{background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;
    overflow-y:auto;padding:24px;position:relative}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:24px}
  .brand .logo{width:36px;height:36px;border-radius:10px;background:var(--pink);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:1rem;box-shadow:0 6px 18px var(--pink-glow)}
  .brand h1{font-size:1.1rem;font-weight:800;letter-spacing:-.02em}
  .brand small{display:block;font-size:.68rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
  .lang-switch{margin-left:auto;display:flex;background:var(--bg);border:1px solid var(--line);
    border-radius:10px;padding:2px;gap:2px}
  .lang-btn{border:none;background:transparent;padding:4px 8px;border-radius:8px;
    font-size:.66rem;font-weight:800;color:var(--muted);cursor:pointer;transition:.15s}
  .lang-btn.active{background:var(--ink);color:#fff}

  .panel{animation:fade .25s}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .f-name{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;line-height:1.2}
  .f-addr{font-size:.8rem;color:var(--muted);margin-top:6px;display:flex;gap:6px;align-items:center;font-weight:500}
  .f-addr i{color:var(--pink);font-size:.7rem}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:800;
    padding:6px 11px;border-radius:30px;margin-top:10px}
  .badge.green{background:#e6f8ee;color:#0f8a4b}
  .badge.amber{background:#fff3e0;color:#b06a00}
  .badge.red{background:#fdeaea;color:#c02b25}

  .stats{display:flex;gap:14px;margin:14px 0 18px;font-size:.76rem;color:#5b6076;font-weight:600;flex-wrap:wrap}
  .stats span{display:flex;align-items:center;gap:5px}
  .stats i{color:var(--pink);font-size:.72rem}

  .btn{width:100%;border:none;border-radius:14px;padding:14px;font-size:.9rem;font-weight:800;
    display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:.15s;text-decoration:none}
  .btn-primary{background:var(--pink);color:#fff;box-shadow:0 10px 24px var(--pink-glow)}
  .btn-primary:active{transform:scale(.98)}
  .btn-dark{background:var(--ink);color:#fff}
  .btn-ghost{background:var(--bg);color:#4a5066;border:1px solid var(--line)}
  .btn+.btn{margin-top:10px}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  .wheel-wrap{display:flex;align-items:center;gap:22px;background:var(--bg);
    border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0}
  .wheel{position:relative;width:120px;height:120px;flex:0 0 auto;touch-action:none;user-select:none}
  .wheel svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
  .wheel .track{fill:none;stroke:#e4e4ee;stroke-width:11;stroke-linecap:round}
  .wheel .prog{fill:none;stroke:var(--pink);stroke-width:11;stroke-linecap:round;
    filter:drop-shadow(0 0 6px var(--pink-glow))}
  .wheel .knob{position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;
    border:5px solid var(--pink);top:50%;left:50%;margin:-12px 0 0 -12px;
    box-shadow:0 4px 14px var(--pink-glow);cursor:grab;transform-origin:center;
    transform:rotate(0deg) translateY(-50.4px)}
  .wheel .knob:active{cursor:grabbing}
  .wheel-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;pointer-events:none}
  .wheel-center b{font-size:1.55rem;font-weight:800;line-height:1}
  .wheel-center small{font-size:.62rem;font-weight:800;color:var(--muted);
    text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
  .price-box{flex:1}
  .price-box .lbl{font-size:.64rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
  .price-box .amt{font-size:1.85rem;font-weight:800;letter-spacing:-.03em;margin-top:3px;line-height:1.1}
  .price-box .amt span{font-size:.85rem;font-weight:700;color:var(--muted)}
  .price-box .tier{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;
    font-weight:800;margin-top:6px;padding:4px 9px;border-radius:20px}
  .tier.off{background:#e6f8ee;color:#0f8a4b}
  .tier.peak{background:#fff3e0;color:#b06a00}

  .field{margin:10px 0}
  .field label{display:block;font-size:.66rem;font-weight:800;text-transform:uppercase;
    letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
  .field input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    font-size:.94rem;font-weight:700;background:#fff;letter-spacing:.03em}
  .field input:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-soft)}

  .kv{display:flex;justify-content:space-between;font-size:.78rem;padding:9px 0;
    border-bottom:1px dashed var(--line);font-weight:600;color:#5b6076}
  .kv strong{color:var(--ink);font-weight:800}
  .kv.total{border-bottom:none;padding-top:12px;font-size:.92rem}
  .kv.total strong{color:var(--pink);font-size:1.05rem}

  .session-card{background:linear-gradient(135deg,#12121c 0%,#2a1030 100%);
    color:#fff;border-radius:20px;padding:18px;margin-bottom:16px}
  .session-card .lbl{font-size:.66rem;font-weight:800;text-transform:uppercase;
    letter-spacing:.08em;color:rgba(255,255,255,.6)}
  .timer{font-variant-numeric:tabular-nums;font-size:2rem;font-weight:800;
    letter-spacing:.03em;margin:4px 0 2px;color:var(--pink)}
  .session-card .meta{font-size:.76rem;color:rgba(255,255,255,.75);font-weight:600}
  .session-card .cost{font-size:1rem;font-weight:800;margin-top:8px}
  .session-actions{display:flex;gap:8px;margin-top:14px}
  .session-actions .btn{flex:1;padding:11px;font-size:.8rem;margin:0}

  .modal{position:fixed;inset:0;background:rgba(10,10,18,.55);backdrop-filter:blur(4px);
    z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;
    opacity:0;pointer-events:none;transition:opacity .2s}
  .modal.show{opacity:1;pointer-events:auto}
  .card{background:#fff;border-radius:22px;padding:28px;max-width:420px;width:100%;
    box-shadow:0 40px 80px rgba(0,0,0,.4);transform:scale(.94);
    transition:transform .25s cubic-bezier(.2,1.2,.4,1);max-height:90vh;overflow-y:auto}
  .modal.show .card{transform:scale(1)}
  .card h3{font-size:1.2rem;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
  .card .sub{font-size:.76rem;color:var(--muted);margin-bottom:18px;font-weight:600}

  .pays{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
  .pay{display:flex;align-items:center;gap:8px;padding:12px;border-radius:12px;
    border:2px solid var(--line);background:#fff;font-size:.78rem;font-weight:800;
    color:#4a5066;cursor:pointer;justify-content:center;transition:.15s}
  .pay i{color:#9aa0b0;font-size:1rem}
  .pay.active{border-color:var(--pink);background:var(--pink-soft);color:var(--ink)}
  .pay.active i{color:var(--pink)}

  .invoice{background:#f2f6ff;border:1px dashed #6a8dff;border-radius:12px;
    padding:12px;display:flex;gap:10px;margin-bottom:14px;align-items:flex-start}
  .invoice i{color:#4a6eff;font-size:1.1rem;margin-top:2px}
  .invoice .it{flex:1;font-size:.7rem;color:#2a3a7a;font-weight:700;line-height:1.45}
  .invoice .it b{display:block;font-size:.74rem;margin-bottom:2px}
  .invoice .code{font-family:'Courier New',monospace;letter-spacing:.5px;font-size:.72rem}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--ink);color:#fff;font-size:.8rem;font-weight:700;padding:12px 20px;
    border-radius:30px;z-index:3000;box-shadow:0 10px 30px rgba(0,0,0,.3);
    opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}

  .hint{font-size:.72rem;color:var(--muted);font-weight:600;text-align:center;margin-top:10px}
  .divider{height:1px;background:var(--line);margin:16px 0}
  .empty{text-align:center;padding:40px 10px;color:var(--muted)}
  .empty i{font-size:2.4rem;color:#dcdce6;margin-bottom:12px;display:block}
  .empty p{font-size:.82rem;font-weight:600}

  .route-steps{background:#f7f7fb;border:1px solid var(--line);border-radius:14px;
    padding:6px 12px;margin-bottom:14px;max-height:150px;overflow-y:auto}
  .route-step{display:flex;align-items:flex-start;gap:8px;padding:7px 0;font-size:.73rem;line-height:1.35}
  .route-step + .route-step{border-top:1px solid var(--line)}
  .route-step i{color:var(--pink);margin-top:2px;font-size:.7rem;flex:0 0 auto;width:14px;text-align:center}
  .route-step .rs-txt{flex:1;color:var(--ink);font-weight:600}
  .route-step .rs-dist{color:var(--muted);font-weight:700;font-size:.68rem;white-space:nowrap}

  .resume-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:linear-gradient(135deg,#12121c,#2a1030);color:#fff;border-radius:14px;
    padding:12px 14px;margin-bottom:14px;cursor:pointer;box-shadow:0 6px 18px rgba(18,18,28,.16);
    transition:transform .12s}
  .resume-bar:hover{transform:translateY(-1px)}
  .resume-bar b{display:block;font-size:.82rem;font-weight:800}
  .resume-bar small{display:block;font-size:.69rem;color:rgba(255,255,255,.72);margin-top:2px}
  .resume-bar span{font-size:.73rem;font-weight:800;color:var(--pink);white-space:nowrap}

  .map-styles{position:absolute;bottom:18px;left:18px;z-index:500;display:flex;gap:4px;
    background:rgba(255,255,255,.95);backdrop-filter:blur(8px);padding:4px;border-radius:14px;
    border:1px solid var(--line);box-shadow:0 6px 20px rgba(18,18,28,.12)}
  .style-btn{border:none;background:transparent;padding:7px 11px;border-radius:10px;
    font-size:.73rem;font-weight:700;color:#4a5066;cursor:pointer;display:flex;align-items:center;
    gap:5px;transition:.15s;white-space:nowrap}
  .style-btn:hover{background:#f2f3f8;color:var(--ink)}
  .style-btn i{font-size:.7rem;color:#8b90a3}
  .style-btn.active{background:var(--ink);color:#fff}
  .style-btn.active i{color:var(--pink)}

  .map-ctrls{position:absolute;bottom:28px;right:18px;z-index:500;display:flex;flex-direction:column;
    background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-radius:14px;
    border:1px solid var(--line);box-shadow:0 6px 20px rgba(18,18,28,.12);overflow:hidden}
  .map-ctrl{width:36px;height:36px;border:none;background:transparent;color:var(--ink);
    cursor:pointer;display:grid;place-items:center;font-size:.82rem;transition:.15s}
  .map-ctrl:hover:not(:disabled){background:#f2f3f8;color:var(--pink)}
  .map-ctrl:disabled{opacity:.55;cursor:wait}
  .map-ctrl + .map-ctrl{border-top:1px solid var(--line)}
  @media(max-width:900px){
    .map-styles{bottom:10px;left:10px;gap:2px;padding:3px;border-radius:12px}
    .style-btn{padding:5px 8px;font-size:.66rem;gap:4px}
    .map-ctrls{bottom:22px;right:10px;border-radius:12px}
    .map-ctrl{width:32px;height:32px;font-size:.76rem}
  }
  .leaflet-control-attribution{font-size:7px!important;opacity:.6!important}
</style>
</head>
<body>

<div class="app">
  <div class="map-wrap">
    <div id="map"></div>
    <div class="searchbar">
      <div style="flex:1">
        <div class="search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input id="searchInput" type="text" placeholder="Tìm bãi đỗ xe tại Hà Nội…" autocomplete="off" />
        </div>
        <div class="chips" id="chips">
          <div class="chip active" data-filter="all"><i class="fa-solid fa-layer-group"></i><span data-i18n="filterAll">Tất cả</span></div>
          <div class="chip" data-filter="basement"><i class="fa-solid fa-building"></i><span data-i18n="filterBasement">Hầm xe</span></div>
          <div class="chip" data-filter="surface"><i class="fa-solid fa-square-parking"></i><span data-i18n="filterSurface">Bãi nổi</span></div>
          <div class="chip" data-filter="ev"><i class="fa-solid fa-bolt"></i><span data-i18n="filterEv">Sạc EV</span></div>
          <div class="chip" data-filter="curbside"><i class="fa-solid fa-road"></i><span data-i18n="filterCurbside">Ven đường</span></div>
        </div>
      </div>
    </div>
    <div class="map-styles" id="mapStyles" role="group" aria-label="Map style">
      <button type="button" class="style-btn active" data-style="liberty"><i class="fa-solid fa-map"></i><span data-i18n="styleStreet">Đường phố</span></button>
      <button type="button" class="style-btn" data-style="positron"><i class="fa-solid fa-sun"></i><span data-i18n="styleLight">Sáng</span></button>
      <button type="button" class="style-btn" data-style="satellite"><i class="fa-solid fa-satellite"></i><span data-i18n="styleSatellite">Vệ tinh</span></button>
    </div>
    <div class="map-ctrls" role="group" aria-label="Map controls">
      <button type="button" class="map-ctrl" id="zoomInBtn" title="Phóng to" aria-label="Phóng to"><i class="fa-solid fa-plus"></i></button>
      <button type="button" class="map-ctrl" id="zoomOutBtn" title="Thu nhỏ" aria-label="Thu nhỏ"><i class="fa-solid fa-minus"></i></button>
      <button type="button" class="map-ctrl" id="locateBtn" title="Vị trí của tôi / Trung tâm Hà Nội" aria-label="Vị trí của tôi hoặc Trung tâm Hà Nội"><i class="fa-solid fa-location-crosshairs"></i></button>
    </div>
  </div>

  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><i class="fa-solid fa-parking"></i></div>
      <div>
        <h1>ParkEase</h1>
        <small id="brandSub">Đỗ xe thông minh Hà Nội</small>
      </div>
      <div class="lang-switch" id="langSwitch" role="group" aria-label="Language">
        <button type="button" class="lang-btn active" data-lang="vi">VI</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>
    <div id="panel"></div>
  </aside>
</div>

<div class="modal" id="modal"><div class="card" id="modalCard"></div></div>
<div class="toast" id="toast">Saved</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js"></script>
<script>
/* ================================================================
   ParkEase — frontend (talks to Express backend)
   ================================================================ */
(function(){
'use strict';

const API = '';   // same-origin. Change to "https://your-api.onrender.com" if split.

const $ = s => document.querySelector(s);
const panelEl = document.getElementById('panel');
const modal = document.getElementById('modal');
const modalCard = document.getElementById('modalCard');
const toastEl = document.getElementById('toast');
const chipsEl = document.getElementById('chips');
const searchEl = document.getElementById('searchInput');

/* ---------- state & i18n ---------- */
const LANG_KEY = 'parkease_lang';
const I18N = {
  vi: {
    title: 'ParkEase — Đỗ xe thông minh Hà Nội',
    brandSub: 'Đỗ xe thông minh Hà Nội',
    searchPlaceholder: 'Tìm bãi đỗ xe tại Hà Nội…',
    filterAll: 'Tất cả',
    filterBasement: 'Hầm xe',
    filterSurface: 'Bãi nổi',
    filterEv: 'Sạc EV',
    filterCurbside: 'Ven đường',
    styleStreet: 'Đường phố',
    styleLight: 'Sáng',
    styleSatellite: 'Vệ tinh',
    zoomIn: 'Phóng to',
    zoomOut: 'Thu nhỏ',
    locateTitle: 'Vị trí của tôi / Trung tâm Hà Nội',
    stopsNearby: n => `${n} điểm đỗ xe quanh đây`,
    peak: 'cao điểm',
    offPeak: 'thấp điểm',
    avail: 'Còn chỗ',
    limited: 'Sắp đầy',
    almostFull: 'Gần hết',
    full: 'Hết chỗ',
    freeCount: n => `${n} chỗ trống`,
    fromRate: v => `từ ${v}/giờ`,
    evShort: 'Sạc EV',
    emptyFilter: 'Không tìm thấy bãi đỗ nào phù hợp.',
    activeSessionBay: b => `Đang gửi xe · Ô ${b}`,
    resume: 'Quay lại',
    bayHeldName: n => `Đang giữ chỗ · ${n}`,
    directions: 'Chỉ đường',
    backToMap: 'Quay lại bản đồ',
    baysFrac: (a, t) => `${a}/${t} chỗ trống`,
    baysTotal: t => `${t} chỗ`,
    evCharging: 'Sạc xe điện EV',
    hrsUnit: 'GIỜ',
    estTotal: 'Tổng ước tính',
    tierPeak: 'Cao điểm 1.5×',
    tierOff: 'Thấp điểm −30%',
    plateLabel: 'Biển số xe của bạn',
    plateHint: 'Dùng để mở barie cổng. Ví dụ: 30H-987.65',
    holdDep: 'Đặt cọc giữ chỗ (50%)',

const T = (key, ...args) => {
  const dict = I18N[UI.lang] || I18N.vi;
  const val = dict[key];
  return typeof val === 'function' ? val(...args) : (val ?? key);
};

const ERR_VI = {
  'Invalid plate format': 'Biển số xe chưa đúng định dạng (vd: 30H-987.65)',
  'No free bays at this facility right now': 'Bãi xe này hiện đã hết chỗ trống',

  'Session not found': 'Không tìm thấy phiên gửi xe',
  'Facility not found': 'Không tìm thấy bãi đỗ xe',
};

function errMsg(e){
  const msg = e && e.message ? e.message : String(e || '');
  return UI.lang === 'vi' ? (ERR_VI[msg] || msg) : msg;
}

/* ---------- helpers ---------- */
function toast(msg, ms=2000){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(()=>toastEl.classList.remove('show'), ms);
}
const fmtVND = n => n.toLocaleString('vi-VN') + ' VND';
const fmtDuration = h => {
  const hh = Math.floor(h), mm = Math.round((h-hh)*60);
  return `${hh}h ${String(mm).padStart(2,'0')}m`;
};
const fmtClock = ms => {
  const s = Math.max(0, Math.floor(ms/1000));
  return [Math.floor(s/3600), Math.floor(s%3600/60), s%60]
    .map(n => String(n).padStart(2,'0')).join(':');
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pinClass = f => {
  const r = f.avail / f.total;
  return r > 0.30 ? 'green' : r > 0.10 ? 'amber' : 'red';
};
const statusLabel = f => {
  if (f.avail <= 0) return T('full');
  const cls = pinClass(f);
  return cls === 'green' ? T('avail') : cls === 'amber' ? T('limited') : T('almostFull');
};

async function withBusy(btn, fn){
  if (UI.busy) return;
  UI.busy = true;
  const prevHtml = btn ? btn.innerHTML : '';
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>${esc(T('working'))}`;
  }
  try {
    return await fn();
  } finally {
    UI.busy = false;
    if (btn && btn.isConnected) {
      btn.disabled = false;
      btn.innerHTML = prevHtml;
    }
  }
}

function applyStaticI18n(){
  document.documentElement.lang = UI.lang;
  document.title = T('title');
  const sub = document.getElementById('brandSub');
  if (sub) sub.textContent = T('brandSub');
  searchEl.placeholder = T('searchPlaceholder');
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = T(el.dataset.i18n);
  });
  const zi = document.getElementById('zoomInBtn');
  const zo = document.getElementById('zoomOutBtn');
  const lo = document.getElementById('locateBtn');
  if (zi) { zi.title = T('zoomIn'); zi.setAttribute('aria-label', T('zoomIn')); }
  if (zo) { zo.title = T('zoomOut'); zo.setAttribute('aria-label', T('zoomOut')); }
  if (lo) { lo.title = T('locateTitle'); lo.setAttribute('aria-label', T('locateTitle')); }

  }

function setLang(lang){
  if (lang !== 'vi' && lang !== 'en') return;
  UI.lang = lang;
  try { localStorage.setItem(LANG_KEY, lang); } catch {}
  applyStaticI18n();
  if (UI.mode === 'navigating' && UI.facilityId) {
    const f = UI.facilitiesRaw.find(x => x.id === UI.facilityId);
    if (f) return startNavigation(f);
  }
  renderPanel();
}

const STORE_KEY = 'parkease_state';
const serverNow = () => Date.now() + UI.clockOffset;

function saveLocalState(){
  try {
    if (UI.session) {
      localStorage.setItem(STORE_KEY, JSON.stringify({ sessionId: UI.session.id }));
    } else if (UI.reservation) {
      localStorage.setItem(STORE_KEY, JSON.stringify({ reservationId: UI.reservation.id }));
    } else {
      localStorage.removeItem(STORE_KEY);
    }
  } catch { /* ignore storage errors */ }
}

function readPlateInput(id){
  const el = document.getElementById(id);
  const val = (el ? el.value : UI.plate).trim().toUpperCase();
  if (!val) { toast(T('enterPlate')); return null; }
  UI.plate = val;
  if (el) el.value = val;
  return val;
}

/* ---------- API client ---------- */
async function api(path, opts={}){
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  if (data && typeof data.serverTime === 'number') {
    UI.clockOffset = data.serverTime - Date.now();
  }
  return data;
}

/* ---------- map ---------- */
const HANOI_CENTER = [21.0285, 105.8542];
const HANOI_ZOOM = 13.4;
const OFM_ATTR = '<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> &copy; <a href="https://www.openmaptiles.org/" target="_blank">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>';
const MAP_STYLES = {
  liberty:   { type:'vector', url:'https://tiles.openfreemap.org/styles/liberty' },
  positron:  { type:'vector', url:'https://tiles.openfreemap.org/styles/positron' },
  satellite: {
    type:'raster',
    url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    attr:'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics',
  },
};

const map = L.map('map', { zoomControl:false }).setView(HANOI_CENTER, HANOI_ZOOM);
let baseLayer = null;
let userDot = null;
let currentStyle = 'liberty';

function setMapStyle(key){
  if (!MAP_STYLES[key] || (key === currentStyle && baseLayer)) return;
  if (baseLayer) map.removeLayer(baseLayer);
  const cfg = MAP_STYLES[key];
  if (cfg.type === 'vector') {
    try {
      baseLayer = L.maplibreGL({
        style: cfg.url,
        attributionControl: { customAttribution: OFM_ATTR },
      }).addTo(map);
    } catch {
      baseLayer = L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
        attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, Tiles style by <a href="https://www.hotosm.org/" target="_blank">HOT</a>',
        maxZoom:19,
      }).addTo(map);
    }
  } else {
    baseLayer = L.tileLayer(cfg.url, { attribution: cfg.attr, maxZoom: 19 }).addTo(map);
  }
  currentStyle = key;
  const wrap = document.getElementById('mapStyles');
  if (wrap) {
    wrap.querySelectorAll('.style-btn').forEach(btn=>{
      btn.classList.toggle('active', btn.dataset.style === key);
    });
  }
}
setMapStyle('liberty');

const markers = {};
window.addEventListener('resize', ()=>map.invalidateSize());

async function loadFacilities(){
  try {
    const data = await api('/api/facilities');
    UI.facilitiesRaw = data.facilities;
    UI.peak = data.peak;
    UI.facilities = filterList(data.facilities);
    syncMarkers(UI.facilities);
    if (UI.mode === 'browse') renderPanel();
  } catch(e){
    toast(T('cannotReach', errMsg(e)), 4000);
  }
}

function filterList(list){
  return list.filter(f=>{
    if (UI.filter === 'ev' && !f.ev) return false;
    if (UI.filter !== 'all' && UI.filter !== 'ev' && f.type !== UI.filter) return false;
    if (UI.search && !(f.name+' '+f.addr).toLowerCase().includes(UI.search.toLowerCase())) return false;
    return true;
  });
}

function makePinIcon(f){
  const cls = pinClass(f);
  const sel = f.id === UI.facilityId ? ' selected' : '';
  const ev = f.ev ? '<i class="fa-solid fa-bolt ev-ico"></i>' : '';
  const html = `<div class="pin ${cls}${sel}"><span class="dot"></span>${ev}${f.avail} / ${f.total}</div>`;
  return L.divIcon({ className:'', html, iconSize:[0,0], iconAnchor:[0,0] });
}

function syncMarkers(visible){
  const showIds = new Set((visible || []).map(f => f.id));
  if (UI.facilityId) showIds.add(UI.facilityId);
  UI.facilitiesRaw.forEach(f=>{
    const selected = f.id === UI.facilityId;
    const icon = makePinIcon(f);
    let m = markers[f.id];
    if (!m) {
      m = L.marker([f.lat, f.lng], { icon });
      m.on('click', ()=>selectFacility(f.id));
      markers[f.id] = m;
    } else {
      m.setIcon(icon);
    }
    m.setZIndexOffset(selected ? 900 : 0);
    const shouldShow = showIds.has(f.id);
    const onMap = map.hasLayer(m);
    if (shouldShow && !onMap) m.addTo(map);
    else if (!shouldShow && onMap) map.removeLayer(m);
  });
}

/* ---------- panel renderers ---------- */
function renderPanel(){
  if (UI.mode !== 'session' && UI.mode !== 'navigating') stopTicker();
  if (UI.facilitiesRaw.length) syncMarkers(UI.facilities);
  if (UI.mode === 'browse') return renderBrowse();
  if (UI.mode === 'facility') return renderFacility();
  if (UI.mode === 'navigating') return renderNavigating();
  if (UI.mode === 'session') return renderSession();
  if (UI.mode === 'checkout') return renderCheckout();
}

function activeBannerHTML(){
  if (UI.session && UI.mode !== 'session' && UI.mode !== 'checkout') {
    return `<div class="resume-bar" data-act="resume-active">
      <div><b>${esc(T('activeSessionBay', UI.session.bay))}</b><small>${esc(UI.session.facilityName)} · ${esc(UI.session.plate)}</small></div>
      <span>${esc(T('resume'))} <i class="fa-solid fa-arrow-right"></i></span>
    </div>`;
  }
  if (UI.reservation && UI.reservation.status === 'held' && serverNow() < UI.reservation.expiresAt && UI.mode !== 'navigating') {
    return `<div class="resume-bar" data-act="resume-active">
      <div><b>${esc(T('bayHeldName', UI.reservation.facilityName))}</b><small>${esc(UI.reservation.plate)} · ${UI.reservation.hours}h</small></div>
      <span>${esc(T('directions'))} <i class="fa-solid fa-arrow-right"></i></span>
    </div>`;
  }
  return '';
}

function wireActiveBanner(){
  const el = panelEl.querySelector('[data-act="resume-active"]');
  if (!el) return;
  el.addEventListener('click', ()=>{
    if (UI.session) {
      UI.facilityId = UI.session.facilityId;
      UI.mode = 'session';
      const f = UI.facilitiesRaw.find(x => x.id === UI.session.facilityId);
      if (f) map.flyTo([f.lat, f.lng], 15.5, { duration:.6 });
      renderPanel();
      return;
    }
    if (UI.reservation) {
      const f = UI.facilitiesRaw.find(x => x.id === UI.reservation.facilityId);
      if (f) startNavigation(f);
    }
  });
}

function wireWheel(f){
  const wheel = $('#wheel'), prog = $('#wheelProg'), knob = $('#wheelKnob');
  const valEl = $('#wheelVal'), amtEl = $('#amtBox'), tierEl = $('#tierBox'), depEl = $('#depBox');
  const R = 42, C = 2 * Math.PI * R;
  prog.style.strokeDasharray = C;
  const MIN = 0.5, MAX = 8;
  let dragging = false;
  let quoteSeq = 0;
  let quoteCtrl = null;
  let quoteTimer = null;

  function renderQuote(q){
    amtEl.innerHTML = q.total.toLocaleString('vi-VN') + '<span> VND</span>';
    depEl.textContent = fmtVND(q.deposit);
    tierEl.className = 'tier ' + (q.peak ? 'peak' : 'off');
    tierEl.innerHTML = `<i class="fa-solid fa-arrow-${q.peak?'up':'down'}"></i> ${esc(q.peak ? T('tierPeak') : T('tierOff'))}`;
  }

  function localQuote(hours){
    const mult = UI.peak ? 1.5 : 0.7;
    const total = Math.min(Math.round(hours * (f.rate || 20000) * mult), f.cap || 120000);
    return { total, deposit: Math.round(total * 0.5), peak: UI.peak };
  }

  async function refresh(hours){
    const seq = ++quoteSeq;
    if (quoteCtrl) quoteCtrl.abort();
    quoteCtrl = new AbortController();
    try {
      const q = await api(`/api/quote?facilityId=${f.id}&hours=${hours}`, { signal: quoteCtrl.signal });
      if (seq !== quoteSeq || !amtEl.isConnected) return;
      UI.peak = q.peak;
      renderQuote(q);
    } catch(e){ /* ignore aborted or transient quote errors */ }
  }

  function setHours(h, force = false){
    const next = Math.max(MIN, Math.min(MAX, h));
    if (!force && next === UI.hours) return;
    UI.hours = next;
    const p = (UI.hours - MIN) / (MAX - MIN);
    prog.style.strokeDashoffset = C * (1 - p);
    knob.style.transform = `rotate(${p*360}deg) translateY(-50.4px)`;
    valEl.textContent = UI.hours;
    renderQuote(localQuote(UI.hours));
    clearTimeout(quoteTimer);
    if (force) {
      refresh(UI.hours);
    } else {
      quoteTimer = setTimeout(() => refresh(UI.hours), 100);
    }
  }

  function angle(e){
    const r = wheel.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    let a = Math.atan2(e.clientY - cy, e.clientX - cx) * 180/Math.PI + 90;
    if (a < 0) a += 360;
    return a;
  }
  function onMove(e){
    if (!dragging) return;
    const a = angle(e.touches ? e.touches[0] : e);
    setHours(Math.round((MIN + (a/360)*(MAX-MIN)) * 2) / 2);
  }
  function start(e){ e.preventDefault(); dragging = true; document.body.style.userSelect='none';
    window.addEventListener('pointermove', onMove); window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end); onMove(e); }
  function end(){ dragging = false; document.body.style.userSelect='';
    window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', end); window.removeEventListener('pointercancel', end); }
  wheel.addEventListener('pointerdown', start);

  setHours(UI.hours, true);
}

const DEMO_STARTS = {
  vincom:    [21.0008, 105.8414], // Đường Giải Phóng
  lotte:     [21.0188, 105.8027], // Đường Láng
  trangtien: [21.0235, 105.8416], // Đường Lê Duẩn
  opera:     [21.0175, 105.8548], // Phố Trần Xuân Soạn
  daewoo:    [21.0192, 105.8100], // Phố Huỳnh Thúc Kháng
  nhon:      [21.0416, 105.7614], // QL.32 / Đường Cầu Diễn
};

function decodePolyline6(str){
  let index = 0, lat = 0, lng = 0;
  const coords = [];
  while (index < str.length) {
    let b, shift = 0, result = 0;
    do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    lat += (result & 1) ? ~(result >> 1) : (result >> 1);
    shift = 0; result = 0;
    do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    lng += (result & 1) ? ~(result >> 1) : (result >> 1);
    coords.push([lat * 1e-6, lng * 1e-6]);
  }
  return coords;
}

function stepIcon(text){
  const t = (text || '').toLowerCase();
  if (t.includes('u-turn') || t.includes('chữ u') || t.includes('quay đầu')) return 'fa-rotate-left';
  if (t.includes('arrived') || t.includes('destination') || t.includes('đã đến') || t.includes('điểm đến')) return 'fa-flag-checkered';
  if (t.includes('left') || t.includes('trái')) return 'fa-arrow-left';
  if (t.includes('right') || t.includes('phải')) return 'fa-arrow-right';
  return 'fa-arrow-up';
}

function formatOsrmStep(s){
  const m = s.maneuver || {};
  const vi = UI.lang === 'vi';
  const street = s.name ? (vi ? ` vào ${s.name}` : ` onto ${s.name}`) : '';
  if (m.type === 'arrive') return vi ? 'Đến điểm đỗ xe' : 'Arrive at destination';
  if (m.type === 'depart') return s.name ? (vi ? `Lái xe trên ${s.name}` : `Drive on ${s.name}`) : (vi ? 'Bắt đầu di chuyển' : 'Start driving');
  if (m.modifier && m.modifier.includes('uturn')) return (vi ? 'Quay đầu xe' : 'Make a U-turn') + street;
  if (m.modifier === 'straight' || m.type === 'new name' || m.type === 'continue') {
    return s.name ? (vi ? `Tiếp tục trên ${s.name}` : `Continue on ${s.name}`) : (vi ? 'Đi thẳng' : 'Continue straight');
  }
  const modMap = {
    'left': vi ? 'Rẽ trái' : 'Turn left',
    'right': vi ? 'Rẽ phải' : 'Turn right',
    'slight left': vi ? 'Chếch trái' : 'Turn slight left',
    'slight_left': vi ? 'Chếch trái' : 'Turn slight left',
    'slight right': vi ? 'Chếch phải' : 'Turn slight right',
    'slight_right': vi ? 'Chếch phải' : 'Turn slight right',
    'sharp left': vi ? 'Rẽ ngoặt trái' : 'Turn sharp left',
    'sharp_left': vi ? 'Rẽ ngoặt trái' : 'Turn sharp left',
    'sharp right': vi ? 'Rẽ ngoặt phải' : 'Turn sharp right',
    'sharp_right': vi ? 'Rẽ ngoặt phải' : 'Turn sharp right',
  };
  const turn = modMap[m.modifier] || (vi ? 'Đi tiếp' : (m.modifier ? 'Turn ' + m.modifier.replace('_', ' ') : 'Continue'));
  return `${turn}${street}`.trim();
}

async function resolveStartPoint(f){
  const fallbackCoords = DEMO_STARTS[f.id] || [f.lat - 0.012, f.lng - 0.010];
  const fallback = { coords: fallbackCoords, isGps:false };
  if (!navigator.geolocation) return fallback;
  try {
    const pos = await new Promise((resolve, reject) =>
      navigator.geolocation.getCurrentPosition(resolve, reject, {
        enableHighAccuracy:true, timeout:2500, maximumAge:60_000,
      })
    );
    const coords = [pos.coords.latitude, pos.coords.longitude];
    // Keep in-app demo route local to Hanoi if user is testing remotely / via VPN
    if (map.distance(coords, [f.lat, f.lng]) > 50_000) return fallback;
    return { coords, isGps:true };
  } catch {
    return fallback;
  }
}

async function fetchValhallaCarRoute(start, end){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), 6000);
  try {
    const res = await fetch('https://valhalla1.openstreetmap.de/route', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: ctrl.signal,
      body: JSON.stringify({
        locations: [
          { lat: start[0], lon: start[1] },
          { lat: end[0], lon: end[1] },
        ],
        costing: 'auto',
        costing_options: {
          auto: {
            use_living_streets: 0,
            use_tracks: 0,
            alley_factor: 25,
            service_penalty: 500,
            service_factor: 5,
            maneuver_penalty: 20,
          },
        },
        directions_options: { units: 'kilometers', language: UI.lang === 'vi' ? 'vi-VN' : 'en-US' },
      }),
    });
    if (!res.ok) throw new Error('Valhalla HTTP ' + res.status);
    const data = await res.json();
    const leg = data.trip && data.trip.legs && data.trip.legs[0];
    if (!leg || !leg.shape) throw new Error('No Valhalla route');
    const points = decodePolyline6(leg.shape);
    if (!points.length) throw new Error('Empty shape');
    const steps = (leg.maneuvers || [])
      .map(m => ({ text: m.instruction, distanceM: Math.round((m.length || 0) * 1000) }))
      .filter(s => s.text);
    return {
      points,
      distanceM: Math.round((leg.summary?.length || 0) * 1000),
      durationS: leg.summary?.time ?? null,
      steps,
      label: T('carRoute'),
      isFallback: false,
    };
  } finally {
    clearTimeout(t);
  }
}

async function fetchCarRoute(start, end){
  try {
    return await fetchValhallaCarRoute(start, end);
  } catch { /* fallback to OSRM driving if Valhalla is unavailable */ }

  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), 5000);
  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson&steps=true`;
    const res = await fetch(url, { signal:ctrl.signal });
    if (!res.ok) throw new Error('OSRM HTTP ' + res.status);
    const data = await res.json();
    const r = data.routes && data.routes[0];
    if (!r || !r.geometry || !r.geometry.coordinates.length) throw new Error('No route');
    const rawSteps = r.legs && r.legs[0] && r.legs[0].steps ? r.legs[0].steps : [];
    const steps = rawSteps
      .map(s => ({ text: formatOsrmStep(s), distanceM: Math.round(s.distance || 0) }))
      .filter(s => s.text);
    return {
      points: r.geometry.coordinates.map(([lng, lat])=>[lat, lng]),
      distanceM: r.distance,
      durationS: r.duration,
      steps,
      label: T('carFallback'),
      isFallback: false,
    };
  } catch {
    return {
      points: [start, end],
      distanceM: map.distance(start, end),
      durationS: null,
      steps: [],
      label: T('directDist'),
      isFallback: true,
    };
  } finally {
    clearTimeout(t);
  }
}

async function startNavigation(f){
  clearRoute();
  const seq = UI.routeSeq;
  UI.mode = 'navigating';
  UI.facilityId = f.id;
  renderPanel();

  const { coords: start, isGps } = await resolveStartPoint(f);
  if (seq !== UI.routeSeq) return;

  const route = await fetchCarRoute(start, [f.lat, f.lng]);
  if (seq !== UI.routeSeq) return;

  const dash = route.isFallback ? '10 8' : undefined;
  const casing = L.polyline(route.points, { color:'#ffffff', weight:8, opacity:.92, dashArray:dash });
  const line = L.polyline(route.points, { color:'#ff2e73', weight:5, opacity:.95, dashArray:dash });
  const startDot = L.circleMarker(start, {
    radius:7, color:'#ffffff', weight:3, fillColor:'#12121c', fillOpacity:1,
  }).bindTooltip(isGps ? T('yourLoc') : T('startDemoTip'));

  UI.routeLayer = L.layerGroup([casing, line, startDot]).addTo(map);
  map.fitBounds(line.getBounds(), { padding:[70,70] });

  const metaEl = document.getElementById('routeMeta');
  if (metaEl){
    const eta = route.durationS != null ? ` · ~${Math.max(1, Math.round(route.durationS / 60))} ${T('minSuffix')}` : '';
    const src = isGps ? T('gpsSrc') : T('demoSrc');
    metaEl.innerHTML = `<i class="fa-solid fa-car" style="color:var(--pink)"></i><span>${esc(route.label)} · ${fmtDistance(route.distanceM)}${eta} (${src})</span>`;
  }
  const stepsEl = document.getElementById('routeSteps');
  if (stepsEl && route.steps && route.steps.length){
    stepsEl.style.display = 'block';
    stepsEl.innerHTML = route.steps.map(s => `
      <div class="route-step">
        <i class="fa-solid ${stepIcon(s.text)}"></i>
        <span class="rs-txt">${esc(s.text)}</span>
        ${s.distanceM > 0 ? `<span class="rs-dist">${fmtDistance(s.distanceM)}</span>` : ''}
      </div>`).join('');
  }
}

async function doCheckIn(){
  try {
    if (!UI.reservation) throw new Error(T('noRes'));
    toast(T('openingGate'), 1000);
    const session = await api('/api/sessions', {
      method:'POST', body:{ reservationId: UI.reservation.id, plate: UI.plate },
    });
    UI.session = session;
    UI.reservation = null;
    saveLocalState();
    clearRoute();
    toast(T('sessionStarted', session.bay));
    UI.mode = 'session';
    renderPanel();
    loadFacilities();
  } catch(e){ toast(errMsg(e), 3000); }
}

function openCheckout(){
  stopTicker();
  UI.mode = 'checkout';
  renderPanel();
}

async function doPay(btn){
  await withBusy(btn, async ()=>{
    try {
      toast(T('processing'), 1200);
      const { invoice } = await api(`/api/sessions/${UI.session.id}/checkout`, {
        method:'POST', body:{ method: UI.selectedPay },
      });
      UI.session = null;
      UI.reservation = null;
      saveLocalState();
      loadFacilities();

      modalCard.innerHTML = `
        <h3>${T('paySuccess')}</h3>
        <div class="sub">${T('einvoiceIssued')}</div>
        <div class="kv"><span>${T('duration')}</span><strong>${fmtDuration(invoice.elapsedHours)}</strong></div>
        <div class="kv"><span>${T('total')}</span><strong>${fmtVND(invoice.total)}</strong></div>
        <div class="kv"><span>${T('depDeduct')}</span><strong>−${fmtVND(invoice.deposit)}</strong></div>
        <div class="kv total"><span>${T('chargedVia', esc(invoice.method))}</span><strong>${fmtVND(invoice.final)}</strong></div>
        <div class="invoice" style="margin-top:16px">
          <i class="fa-solid fa-file-invoice"></i>
          <div class="it">
            <b>${T('taxCodeTitle')}</b>
            <span class="code">${esc(invoice.lookupCode)}</span>
          </div>
          <i class="fa-solid fa-circle-check" style="color:var(--green);margin-top:2px"></i>
        </div>
        <button class="btn btn-primary" id="doneBtn">${T('done')}</button>
        <p class="hint" style="margin-top:10px">${T('invoiceSaved', esc(invoice.lookupCode))}</p>
      `;
      modal.classList.add('show');
      document.getElementById('doneBtn').addEventListener('click', ()=>{
        modal.classList.remove('show');
        UI.mode = 'browse';
        UI.facilityId = null;
        renderPanel();
      });
    } catch(e){ toast(errMsg(e), 3000); }
  });
}

/* ticker */
function startTicker(){
  stopTicker();
  if (!UI.session) return;
  const tick = ()=>{
    const el = document.getElementById('liveTimer');
    const c = document.getElementById('liveCost');
    if (!el || !UI.session) return stopTicker();
    const s = UI.session;
    const ms = Math.max(0, serverNow() - s.startTs);
    el.textContent = fmtClock(ms);
    if (c){
      const hours = Math.max(0.5, ms/3_600_000);
      // client-side preview only
      const rate = s.rate, cap = s.cap;
      const mult = UI.peak ? 1.5 : 0.7;
      const total = Math.min(Math.round(hours*rate*mult), cap);
      c.textContent = fmtVND(Math.max(0, total - s.deposit)) + T('dueSuffix');
    }
  };
  tick();
  UI.tickTimer = setInterval(tick, 500);
}

function startHoldTicker(){
  stopTicker();
  if (!UI.reservation) return;
  const fmtMMSS = ms => {
    const s = Math.max(0, Math.floor(ms / 1000));
    return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  };
  const tick = ()=>{
    const el = document.getElementById('holdTimer');
    if (!el || !UI.reservation) return stopTicker();
    const rem = UI.reservation.expiresAt - serverNow();
    if (rem <= 0) {
      el.textContent = '00:00';
      el.style.color = '#ff7b7b';
      stopTicker();
      UI.reservation = null;
      saveLocalState();
      const chk = panelEl.querySelector('[data-act="checkin"]');
      if (chk) chk.disabled = true;
      toast(T('holdExpired'), 3500);
      loadFacilities();
      return;
    }
    el.textContent = fmtMMSS(rem);
  };
  tick();
  UI.tickTimer = setInterval(tick, 500);
}
function stopTicker(){ if (UI.tickTimer){ clearInterval(UI.tickTimer); UI.tickTimer = null; } }

/* ---------- wiring ---------- */
chipsEl.addEventListener('click', e=>{
  const c = e.target.closest('.chip');
  if (!c) return;
  chipsEl.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
  c.classList.add('active');
  UI.filter = c.dataset.filter;
  UI.facilities = filterList(UI.facilitiesRaw);
  if (UI.mode === 'browse') renderPanel();
  else syncMarkers(UI.facilities);
});
searchEl.addEventListener('input', ()=>{
  UI.search = searchEl.value.trim();
  UI.facilities = filterList(UI.facilitiesRaw);
  if (UI.mode === 'browse') renderPanel();
  else syncMarkers(UI.facilities);
});

const mapStylesEl = document.getElementById('mapStyles');
if (mapStylesEl) {
  mapStylesEl.addEventListener('click', e=>{
    const btn = e.target.closest('.style-btn');
    if (btn) setMapStyle(btn.dataset.style);
  });
}
document.getElementById('zoomInBtn').addEventListener('click', ()=>map.zoomIn());
document.getElementById('zoomOutBtn').addEventListener('click', ()=>map.zoomOut());
const locateBtn = document.getElementById('locateBtn');
locateBtn.addEventListener('click', async ()=>{
  locateBtn.disabled = true;
  try {
    if (!navigator.geolocation) throw new Error('no-geo');
    const pos = await new Promise((resolve, reject) =>
      navigator.geolocation.getCurrentPosition(resolve, reject, {
        enableHighAccuracy:true, timeout:3000, maximumAge:60_000,
      })
    );
    const coords = [pos.coords.latitude, pos.coords.longitude];
    if (map.distance(coords, HANOI_CENTER) > 50_000) throw new Error('outside-hanoi');
    if (!userDot) {
      userDot = L.circleMarker(coords, {
        radius:7, color:'#ffffff', weight:3, fillColor:'#2563eb', fillOpacity:1,
      }).addTo(map).bindTooltip(T('yourLoc'));
    } else {
      userDot.setLatLng(coords).setTooltipContent(T('yourLoc'));
    }
    map.flyTo(coords, 15, { duration:.7 });
    toast(T('centeredLoc'));
  } catch {
    map.flyTo(HANOI_CENTER, HANOI_ZOOM, { duration:.6 });
    toast(T('centeredHanoi'));
  } finally {
    locateBtn.disabled = false;
  }
});

const langSwitchEl = document.getElementById('langSwitch');
if (langSwitchEl) {
  langSwitchEl.addEventListener('click', e => {
    const btn = e.target.closest('.lang-btn');
    if (btn && btn.dataset.lang) setLang(btn.dataset.lang);
  });
}

async function restoreState(){
  if (UI.mode !== 'browse') return;
  let saved;
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch { return; }
  if (!saved) return;

  if (saved.sessionId) {
    try {
      const s = await api(`/api/sessions/${saved.sessionId}`);
      UI.session = s;
      UI.facilityId = s.facilityId;
      UI.plate = s.plate;
      UI.mode = 'session';
      const f = UI.facilitiesRaw.find(x => x.id === s.facilityId);
      if (f) map.setView([f.lat, f.lng], 15.5);
      renderPanel();
      return;
    } catch { /* session ended or reset on server */ }
  }

  if (saved.reservationId) {
    try {
      const r = await api(`/api/reservations/${saved.reservationId}`);
      const f = UI.facilitiesRaw.find(x => x.id === r.facilityId);
      if (f && r.status === 'held' && serverNow() < r.expiresAt) {
        UI.reservation = r;
        UI.plate = r.plate;
        startNavigation(f);
        return;
      }
    } catch { /* reservation expired or missing */ }
  }

  UI.reservation = null;
  UI.session = null;
  saveLocalState();
}

/* boot */
applyStaticI18n();
(async ()=>{
  await loadFacilities();
  await restoreState();
})();
setInterval(loadFacilities, 30_000);   // refresh availability every 30s
})();
</script>
